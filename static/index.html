<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Purnank — CBSE Study Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1B2A4A;
      --ink-soft: #33456B;
      --paper: #F8F5EE;
      --paper-line: #E7E1D2;
      --marigold: #D48C2C;
      --marigold-dark: #B8751E;
      --marigold-light: #F5E6D0;
      --sage: #6E9A78;
      --slate: #6B7280;
      --white: #FFFFFF;
      --danger: #B0503F;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(27, 42, 74, 0.08);
      --sidebar-width: 320px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--ink);
      color: var(--paper);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(27, 42, 74, 0.2);
      z-index: 10;
      flex-shrink: 0;
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--paper);
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.15s;
      line-height: 1;
    }
    .menu-btn:hover { background: rgba(255,255,255,0.1); }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex: 1;
    }
    .brand-mark {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.01em;
    }
    .brand-tag {
      font-size: 12px;
      color: #C9D3E8;
      font-weight: 500;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #DCE3F2;
      cursor: pointer;
      user-select: none;
    }
    .toggle-row input { accent-color: var(--marigold); cursor: pointer; }

    select#sessionClass {
      background: rgba(255,255,255,0.08);
      color: var(--paper);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 13px;
      font-family: inherit;
    }
    select#sessionClass option {
      color: var(--ink);
      background: var(--white);
    }

    button.ghost-btn {
      background: transparent;
      color: #DCE3F2;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    button.ghost-btn:hover { background: rgba(255,255,255,0.1); }

    /* Sidebar */
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100%;
      background: var(--white);
      box-shadow: 2px 0 20px rgba(27,42,74,0.12);
      z-index: 100;
      transform: translateX(-110%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.3);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #sidebar-overlay.active { opacity: 1; pointer-events: all; }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--paper-line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .sidebar-header h2 {
      font-family: 'Fraunces', serif;
      font-size: 18px;
      margin: 0;
      color: var(--ink);
    }
    .sidebar-header .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--slate);
      padding: 0 4px;
      transition: color 0.15s;
    }
    .sidebar-header .close-btn:hover { color: var(--ink); }

    .sidebar-actions {
      padding: 12px 20px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--paper-line);
    }
    .sidebar-actions button {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--paper-line);
      border-radius: 8px;
      background: var(--white);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
      color: var(--ink-soft);
    }
    .sidebar-actions button:hover {
      background: var(--marigold-light);
      border-color: var(--marigold);
      color: var(--ink);
    }
    .sidebar-actions button.danger:hover {
      background: #FDE8E4;
      border-color: var(--danger);
      color: var(--danger);
    }

    #conversationList {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }
    .conv-item {
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .conv-item:hover {
      background: var(--marigold-light);
      border-color: var(--marigold-light);
    }
    .conv-item.active {
      background: var(--marigold-light);
      border-color: var(--marigold);
    }
    .conv-item .conv-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .conv-item .conv-time {
      font-size: 11px;
      color: var(--slate);
      margin-top: 4px;
    }
    .conv-item .delete-conv {
      background: none;
      border: none;
      color: var(--slate);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
      transition: color 0.15s, background 0.15s;
    }
    .conv-item .delete-conv:hover {
      color: var(--danger);
      background: #FDE8E4;
    }
    .empty-history {
      text-align: center;
      color: var(--slate);
      padding: 40px 20px;
      font-size: 14px;
      line-height: 1.6;
    }
    .empty-history .empty-icon {
      font-size: 36px;
      display: block;
      margin-bottom: 12px;
    }

    /* Main chat area */
    #mainContent {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #chatArea {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 12px;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 33px,
        var(--paper-line) 34px
      );
      background-position: 0 90px;
    }

    #chatInner {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .welcome {
      text-align: center;
      padding: 40px 20px 20px;
      color: var(--slate);
    }
    .welcome h1 {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      color: var(--ink);
      margin: 0 0 8px;
    }
    .welcome p { font-size: 14px; margin: 0; line-height: 1.6; }
    .welcome .chip-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .chip {
      background: var(--white);
      border: 1px solid var(--paper-line);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--ink-soft);
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s, box-shadow 0.15s;
    }
    .chip:hover {
      border-color: var(--marigold);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    /* Messages */
    .msg-row {
      display: flex;
      margin-bottom: 18px;
      animation: rise 0.3s ease-out;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.bot { justify-content: flex-start; }

    .bubble {
      max-width: 82%;
      padding: 14px 18px;
      border-radius: var(--radius);
      line-height: 1.7;
      font-size: 15px;
    }
    .msg-row.user .bubble {
      background: var(--ink);
      color: var(--paper);
      border-bottom-right-radius: 4px;
    }
    .msg-row.bot .bubble {
      background: var(--white);
      border: 1px solid var(--paper-line);
      border-left: 3px solid var(--marigold);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow);
    }

    .bubble p { margin: 0 0 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h3, .bubble h4 {
      font-family: 'Fraunces', serif;
      color: var(--ink);
      margin: 16px 0 8px;
      font-size: 16px;
    }
    .bubble h3:first-child, .bubble h4:first-child { margin-top: 0; }
    .bubble ul, .bubble ol { margin: 6px 0 10px; padding-left: 22px; }
    .bubble li { margin-bottom: 4px; }
    .bubble strong { color: var(--marigold-dark); font-weight: 700; }
    .bubble table {
      border-collapse: collapse;
      width: 100%;
      margin: 10px 0;
      font-size: 13.5px;
    }
    .bubble th, .bubble td {
      border: 1px solid var(--paper-line);
      padding: 6px 9px;
      text-align: left;
    }
    .bubble th { background: #F3EEE1; font-family: 'Fraunces', serif; }
    .bubble code {
      background: #F0ECDF;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .bubble hr { border: none; border-top: 1px solid var(--paper-line); margin: 14px 0; }

    .thinking .bubble {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 16px 20px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--marigold);
      animation: bounce 1.1s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    .error-note { color: var(--danger); font-size: 13px; margin-top: 6px; }

    /* Sources */
    .sources-toggle {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--paper-line);
    }
    .sources-toggle summary {
      cursor: pointer;
      font-size: 13px;
      color: var(--slate);
      font-weight: 500;
      padding: 4px 0;
    }
    .sources-toggle summary:hover { color: var(--ink); }
    .sources-toggle ul {
      margin: 8px 0 4px;
      padding-left: 18px;
      list-style: none;
    }
    .sources-toggle li {
      font-size: 13px;
      color: var(--ink-soft);
      margin-bottom: 6px;
      padding: 6px 10px;
      background: #F6F3EB;
      border-radius: 6px;
      border-left: 2px solid var(--marigold);
    }
    .sources-toggle li strong { color: var(--ink); font-weight: 600; }
    .sources-toggle li .snippet {
      color: var(--slate);
      font-size: 12px;
      display: block;
      margin-top: 2px;
      font-style: italic;
    }
    .sources-toggle li .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 8px;
      border-radius: 999px;
      margin-right: 6px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .badge-textbook { background: #DCE8F5; color: #1B4F8A; }
    .badge-marking { background: #F5E8D4; color: #8A6B1B; }
    .badge-web { background: #D4F5E8; color: #1B8A6B; }

    /* Suggestions */
    .suggestions-row {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--paper-line);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .suggestions-row .chip {
      font-size: 12px;
      padding: 5px 14px;
      background: #F0ECDF;
      border: 1px solid var(--paper-line);
      border-radius: 999px;
      color: var(--ink-soft);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      font-family: inherit;
    }
    .suggestions-row .chip:hover {
      background: var(--marigold);
      color: var(--white);
      border-color: var(--marigold);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    /* Input bar */
    #inputBar {
      border-top: 1px solid var(--paper-line);
      background: var(--paper);
      padding: 14px 20px 18px;
      flex-shrink: 0;
    }
    #inputInner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--white);
      border: 1px solid var(--paper-line);
      border-radius: var(--radius);
      padding: 8px 8px 8px 16px;
      box-shadow: 0 1px 4px rgba(27,42,74,0.06);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #inputInner:focus-within {
      border-color: var(--marigold);
      box-shadow: 0 0 0 3px rgba(212,140,44,0.1);
    }
    textarea#questionInput {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      padding: 8px 0;
      max-height: 140px;
      background: transparent;
      color: var(--ink);
    }
    textarea#questionInput::placeholder { color: #A6ADBB; }

    button#sendBtn {
      background: var(--marigold);
      color: var(--white);
      border: none;
      border-radius: 10px;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }
    button#sendBtn:hover:not(:disabled) { background: var(--marigold-dark); }
    button#sendBtn:disabled { background: #D8D2C2; cursor: not-allowed; }
    button#sendBtn:active:not(:disabled) { transform: scale(0.94); }

    .hint {
      text-align: center;
      font-size: 11.5px;
      color: #9BA3AF;
      margin-top: 8px;
    }

    @media (max-width: 640px) {
      header { padding: 10px 14px; }
      .brand-tag { display: none; }
      .header-controls .toggle-row span { display: none; }
      #chatInner, #inputInner { padding-left: 12px; padding-right: 12px; }
      .bubble { max-width: 92%; }
      :root { --sidebar-width: 280px; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar-overlay"></div>
<div id="sidebar">
  <div class="sidebar-header">
    <h2>📚 Chats</h2>
    <button class="close-btn" id="closeSidebarBtn">✕</button>
  </div>
  <div class="sidebar-actions">
    <button id="newChatSidebarBtn">➕ New Chat</button>
    <button class="danger" id="clearAllBtn">🗑️ Clear All</button>
  </div>
  <div id="conversationList"></div>
</div>

<!-- Main -->
<div id="mainContent">
  <header>
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="brand">
      <span class="brand-mark">Purnank</span>
      <span class="brand-tag">CBSE study companion</span>
    </div>
    <div class="header-controls">
      <select id="sessionClass">
        <option value="">Any class</option>
        <option value="10">Class 10</option>
        <option value="12">Class 12</option>
      </select>
      <label class="toggle-row">
        <input type="checkbox" id="ensembleToggle">
        <span>Best-answer</span>
      </label>
      <button class="ghost-btn" id="newChatBtn">New chat</button>
    </div>
  </header>

  <div id="chatArea">
    <div id="chatInner">
      <div class="welcome" id="welcomeBlock">
        <h1>What are we studying today?</h1>
        <p>Ask about any Class 10 or 12 CBSE topic — I'll answer from your NCERT textbooks.</p>
        <div class="chip-row">
          <div class="chip" data-q="Explain photosynthesis">🌱 Explain photosynthesis</div>
          <div class="chip" data-q="Difference between mitosis and meiosis">🧬 Mitosis vs meiosis</div>
          <div class="chip" data-q="How should I structure a 5 mark answer?">📝 How to structure a 5-mark answer</div>
        </div>
      </div>
    </div>
  </div>

  <div id="inputBar">
    <div id="inputInner">
      <textarea id="questionInput" placeholder="Ask Purnank a question..." rows="1"></textarea>
      <button id="sendBtn" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </div>
</div>

<script>
  // -------------------- DOM refs --------------------
  const chatInner = document.getElementById('chatInner');
  const chatArea = document.getElementById('chatArea');
  const input = document.getElementById('questionInput');
  const sendBtn = document.getElementById('sendBtn');
  const welcomeBlock = document.getElementById('welcomeBlock');
  const newChatBtn = document.getElementById('newChatBtn');
  const ensembleToggle = document.getElementById('ensembleToggle');
  const sessionClass = document.getElementById('sessionClass');
  const menuBtn = document.getElementById('menuBtn');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const closeSidebarBtn = document.getElementById('closeSidebarBtn');
  const conversationList = document.getElementById('conversationList');
  const newChatSidebarBtn = document.getElementById('newChatSidebarBtn');
  const clearAllBtn = document.getElementById('clearAllBtn');

  let sessionId = localStorage.getItem('purnank_session_id') || null;
  let sending = false;
  let currentConvId = localStorage.getItem('purnank_current_conv_id') || null;

  // -------------------- Conversation storage --------------------
  function getConversations() {
    try { return JSON.parse(localStorage.getItem('purnank_conversations')) || {}; } catch { return {}; }
  }
  function saveConversations(convs) { localStorage.setItem('purnank_conversations', JSON.stringify(convs)); }

  function getCurrentConv() {
    const convs = getConversations();
    if (currentConvId && convs[currentConvId]) return convs[currentConvId];
    return createNewConversation();
  }

  function createNewConversation() {
    const convs = getConversations();
    const id = Date.now().toString();
    convs[id] = { id, title: 'New chat', messages: [], created: new Date().toISOString(), updated: new Date().toISOString() };
    saveConversations(convs);
    currentConvId = id;
    localStorage.setItem('purnank_current_conv_id', currentConvId);
    return convs[id];
  }

  function saveCurrentConv(messages) {
    const convs = getConversations();
    if (currentConvId && convs[currentConvId]) {
      convs[currentConvId].messages = messages;
      convs[currentConvId].updated = new Date().toISOString();
      if (messages.length) {
        const first = messages.find(m => m.role === 'user');
        if (first) convs[currentConvId].title = first.content.slice(0,50) + (first.content.length>50?'...':'');
      }
      saveConversations(convs);
      renderConversationList();
    }
  }

  function loadConversation(id) {
    const convs = getConversations();
    if (!convs[id]) return;
    currentConvId = id;
    localStorage.setItem('purnank_current_conv_id', currentConvId);
    chatInner.innerHTML = '';
    welcomeBlock.style.display = 'none';
    convs[id].messages.forEach(msg => {
      if (msg.role === 'user') addMessage('user', msg.content);
      else addMessage('bot', msg.content, msg.sources, msg.suggestions);
    });
    renderConversationList();
    closeSidebar();
    if (convs[id].messages.length === 0) { chatInner.appendChild(welcomeBlock); welcomeBlock.style.display = 'block'; }
  }

  function deleteConversation(id) {
    if (!confirm('Delete this conversation?')) return;
    const convs = getConversations();
    delete convs[id];
    saveConversations(convs);
    if (currentConvId === id) {
      const ids = Object.keys(convs);
      if (ids.length) loadConversation(ids[0]);
      else { currentConvId = null; localStorage.removeItem('purnank_current_conv_id'); chatInner.innerHTML = ''; chatInner.appendChild(welcomeBlock); welcomeBlock.style.display = 'block'; }
    }
    renderConversationList();
  }

  function clearAllConversations() {
    if (!confirm('Delete ALL conversations?')) return;
    saveConversations({});
    currentConvId = null;
    localStorage.removeItem('purnank_current_conv_id');
    chatInner.innerHTML = '';
    chatInner.appendChild(welcomeBlock);
    welcomeBlock.style.display = 'block';
    renderConversationList();
  }

  // -------------------- Render sidebar --------------------
  function renderConversationList() {
    const convs = getConversations();
    const ids = Object.keys(convs).sort((a,b) => new Date(convs[b].updated) - new Date(convs[a].updated));
    if (!ids.length) {
      conversationList.innerHTML = `<div class="empty-history"><span class="empty-icon">💬</span><strong>No chats yet</strong><p>Start a conversation by asking a question!</p></div>`;
      return;
    }
    let html = '';
    ids.forEach(id => {
      const c = convs[id];
      const active = id === currentConvId;
      const date = new Date(c.updated);
      const timeStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      html += `<div class="conv-item ${active?'active':''}" data-id="${id}">
        <div class="conv-title"><span>${c.title}</span><button class="delete-conv" data-id="${id}">✕</button></div>
        <div class="conv-time">${timeStr} · ${c.messages.length} messages</div>
      </div>`;
    });
    conversationList.innerHTML = html;
    conversationList.querySelectorAll('.conv-item').forEach(el => {
      el.addEventListener('click', function(e) { if (e.target.classList.contains('delete-conv')) return; loadConversation(this.dataset.id); });
    });
    conversationList.querySelectorAll('.delete-conv').forEach(btn => {
      btn.addEventListener('click', function(e) { e.stopPropagation(); deleteConversation(this.dataset.id); });
    });
  }

  // -------------------- Sidebar controls --------------------
  function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('active'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('active'); }
  menuBtn.addEventListener('click', openSidebar);
  closeSidebarBtn.addEventListener('click', closeSidebar);
  overlay.addEventListener('click', closeSidebar);
  document.addEventListener('keydown', e => { if (e.ctrlKey && e.key==='b') { e.preventDefault(); sidebar.classList.contains('open') ? closeSidebar() : openSidebar(); } if (e.key==='Escape' && sidebar.classList.contains('open')) closeSidebar(); });

  // -------------------- Markdown renderer --------------------
  function renderMarkdown(text) {
    let lines = text.replace(/\r/g,'').split('\n');
    let html = '', inList = null, tableBuffer = [];
    const flushList = () => { if (inList) { html += `</${inList}>`; inList = null; } };
    const flushTable = () => {
      if (!tableBuffer.length) return;
      const rows = tableBuffer.filter(r => !/^\s*\|?\s*-{2,}/.test(r));
      html += '<table>';
      rows.forEach((row,idx) => {
        const cells = row.trim().replace(/^\||\|$/g,'').split('|').map(c => c.trim());
        const tag = idx===0 ? 'th' : 'td';
        html += `<tr>${cells.map(c => `<${tag}>${inline(c)}</${tag}>`).join('')}</tr>`;
      });
      html += '</table>';
      tableBuffer = [];
    };
    const inline = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                         .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
                         .replace(/\*(.+?)\*/g,'<em>$1</em>')
                         .replace(/`(.+?)`/g,'<code>$1</code>');
    for (let raw of lines) {
      const line = raw.trimEnd();
      if (/^\s*\|.*\|\s*$/.test(line)) { tableBuffer.push(line); continue; } else flushTable();
      if (/^###\s+/.test(line)) { flushList(); html += `<h4>${inline(line.replace(/^###\s+/,''))}</h4>`; continue; }
      if (/^##\s+/.test(line))  { flushList(); html += `<h3>${inline(line.replace(/^##\s+/,''))}</h3>`; continue; }
      if (/^#\s+/.test(line))   { flushList(); html += `<h3>${inline(line.replace(/^#\s+/,''))}</h3>`; continue; }
      if (/^\s*---+\s*$/.test(line)) { flushList(); html += '<hr>'; continue; }
      const ulMatch = line.match(/^\s*[-*]\s+(.*)/);
      const olMatch = line.match(/^\s*\d+\.\s+(.*)/);
      if (ulMatch) {
        if (inList !== 'ul') { flushList(); html += '<ul>'; inList = 'ul'; }
        html += `<li>${inline(ulMatch[1])}</li>`;
        continue;
      }
      if (olMatch) {
        if (inList !== 'ol') { flushList(); html += '<ol>'; inList = 'ol'; }
        html += `<li>${inline(olMatch[1])}</li>`;
        continue;
      }
      flushList();
      if (!line.trim()) continue;
      html += `<p>${inline(line)}</p>`;
    }
    flushList(); flushTable();
    return html;
  }

  function scrollToBottom() { chatArea.scrollTop = chatArea.scrollHeight; }

  // -------------------- Sources & suggestions --------------------
  function renderSources(sources) {
    if (!sources || !sources.length) return '';
    let html = '<details class="sources-toggle"><summary>📖 Sources</summary><ul>';
    sources.forEach(s => {
      let badgeClass = 'badge-textbook', label = 'Textbook';
      if (s.type === 'marking_scheme') { badgeClass = 'badge-marking'; label = 'Marking'; }
      else if (s.type === 'web') { badgeClass = 'badge-web'; label = 'Web'; }
      let pageInfo = s.page ? `, p. ${s.page}` : '';
      let classInfo = s.class ? `, Class ${s.class}` : '';
      let subjectInfo = s.subject ? `, ${s.subject}` : '';
      let meta = `(${s.source}${pageInfo}${classInfo}${subjectInfo})`;
      html += `<li><span class="badge ${badgeClass}">${label}</span> <strong>${meta}</strong>`;
      if (s.snippet) html += `<span class="snippet">“${s.snippet}”</span>`;
      html += `</li>`;
    });
    html += '</ul></details>';
    return html;
  }

  function renderSuggestions(suggestions) {
    if (!suggestions || !suggestions.length) return '';
    let html = '<div class="suggestions-row">';
    suggestions.forEach(s => {
      html += `<button class="chip" data-suggestion="${encodeURIComponent(s)}">💡 ${s}</button>`;
    });
    html += '</div>';
    return html;
  }

  // -------------------- Add message --------------------
  function addMessage(role, text, sources, suggestions) {
    welcomeBlock.style.display = 'none';
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'bot') {
      let content = renderMarkdown(text);
      if (sources && sources.length) content += renderSources(sources);
      if (suggestions && suggestions.length) content += renderSuggestions(suggestions);
      bubble.innerHTML = content;
      bubble.querySelectorAll('.suggestions-row .chip').forEach(chip => {
        chip.addEventListener('click', function() {
          const q = decodeURIComponent(this.dataset.suggestion);
          sendMessage(q);
        });
      });
    } else {
      bubble.textContent = text;
    }
    row.appendChild(bubble);
    chatInner.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addThinking() {
    const row = document.createElement('div');
    row.className = 'msg-row bot thinking';
    row.id = 'thinkingRow';
    row.innerHTML = '<div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    chatInner.appendChild(row);
    scrollToBottom();
  }
  function removeThinking() { const r = document.getElementById('thinkingRow'); if (r) r.remove(); }

  // -------------------- Send message (with role mapping) --------------------
  async function sendMessage(text) {
    if (!text.trim() || sending) return;
    sending = true;
    sendBtn.disabled = true;
    const conv = getCurrentConv();
    addMessage('user', text);
    input.value = '';
    input.style.height = 'auto';
    addThinking();

    let question = text;
    const cls = sessionClass.value;
    if (cls) question = `[Class ${cls}] ${question}`;

    // ✅ Fix: map "bot" → "assistant" for Groq API compatibility
    const history = conv.messages.map(msg => ({
      role: msg.role === "bot" ? "assistant" : msg.role,
      content: msg.content
    }));
    const trimmedHistory = history.slice(-20);

    try {
      const resp = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question: question,
          n_results: 3,
          session_id: sessionId,
          use_ensemble: ensembleToggle.checked,
          history: trimmedHistory
        })
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.detail || `Server error (${resp.status})`);
      }
      const data = await resp.json();
      sessionId = data.session_id;
      localStorage.setItem('purnank_session_id', sessionId);
      removeThinking();
      addMessage('bot', data.answer, data.sources, data.suggestions);
      const current = getCurrentConv();
      current.messages.push({ role: 'user', content: text });
      current.messages.push({ role: 'assistant', content: data.answer });
      saveCurrentConv(current.messages);
    } catch (err) {
      removeThinking();
      const row = document.createElement('div');
      row.className = 'msg-row bot';
      row.innerHTML = `<div class="bubble">Something went wrong reaching Purnank.<div class="error-note">${(err.message || err).toString()}</div></div>`;
      chatInner.appendChild(row);
      scrollToBottom();
    } finally {
      sending = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // -------------------- Event listeners --------------------
  sendBtn.addEventListener('click', () => sendMessage(input.value));
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(input.value); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => sendMessage(chip.dataset.q));
  });

  function startNewChat() {
    currentConvId = null;
    localStorage.removeItem('purnank_current_conv_id');
    sessionId = null;
    localStorage.removeItem('purnank_session_id');
    chatInner.innerHTML = '';
    chatInner.appendChild(welcomeBlock);
    welcomeBlock.style.display = 'block';
    renderConversationList();
    closeSidebar();
    input.focus();
  }
  newChatBtn.addEventListener('click', startNewChat);
  newChatSidebarBtn.addEventListener('click', startNewChat);
  clearAllBtn.addEventListener('click', clearAllConversations);

  // -------------------- Init --------------------
  renderConversationList();
  const convs = getConversations();
  if (currentConvId && convs[currentConvId] && convs[currentConvId].messages.length) {
    loadConversation(currentConvId);
  } else {
    createNewConversation();
    renderConversationList();
  }
  input.focus();
</script>
</body>
</html>
